<html>
	<head>
		<title>Darts</title>
		<link rel="stylesheet" href="stylesheet.css" />
		<script src="darts.js"></script>
	</head>
	<body onload="init()">
		<div class="grid-container">
			<div class="page-header">DARTS</div>
			<div class="player-stats" id="player-stats-0">
				<div class="player-heading"     id="player-heading-0">Player 1</div>
				<div class="player-score"       id="player-score-0"></div>
				<div class="player-average"     id="player-average-0"></div>
				<div class="player-darts"       id="player-darts-0"></div>
				<div class="player-round-score" id="player-round-score-0"></div>
			</div>
			<div class="player-stats" id="player-stats-1">
				<div class="player-heading"     id="player-heading-1">Player 2</div>
				<div class="player-score"       id="player-score-1"></div>
				<div class="player-average"     id="player-average-1"></div>
				<div class="player-darts"       id="player-darts-1"></div>
				<div class="player-round-score" id="player-round-score-1"></div>
			</div>
			<div id="checkout-guide"></div>
			<div class="throw-box" id="throw-0"></div>
			<div class="throw-box" id="throw-1"></div>
			<div class="throw-box" id="throw-2"></div>
			<div id="score-button-container">
				<button type="button" class="score-button" id="score-button-1"    onclick="button_click(this, event)">1</button>
				<button type="button" class="score-button" id="score-button-2"    onclick="button_click(this, event)">2</button>
				<button type="button" class="score-button" id="score-button-3"    onclick="button_click(this, event)">3</button>
				<button type="button" class="score-button" id="score-button-4"    onclick="button_click(this, event)">4</button>
				<button type="button" class="score-button" id="score-button-5"    onclick="button_click(this, event)">5</button>
				<button type="button" class="score-button" id="score-button-6"    onclick="button_click(this, event)">6</button>
				<button type="button" class="score-button" id="score-button-7"    onclick="button_click(this, event)">7</button>
				<button type="button" class="score-button" id="score-button-8"    onclick="button_click(this, event)">8</button>
				<button type="button" class="score-button" id="score-button-9"    onclick="button_click(this, event)">9</button>
				<button type="button" class="score-button" id="score-button-10"   onclick="button_click(this, event)">10</button>
				<button type="button" class="score-button" id="score-button-11"   onclick="button_click(this, event)">11</button>
				<button type="button" class="score-button" id="score-button-12"   onclick="button_click(this, event)">12</button>
				<button type="button" class="score-button" id="score-button-13"   onclick="button_click(this, event)">13</button>
				<button type="button" class="score-button" id="score-button-14"   onclick="button_click(this, event)">14</button>
				<button type="button" class="score-button" id="score-button-15"   onclick="button_click(this, event)">15</button>
				<button type="button" class="score-button" id="score-button-16"   onclick="button_click(this, event)">16</button>
				<button type="button" class="score-button" id="score-button-17"   onclick="button_click(this, event)">17</button>
				<button type="button" class="score-button" id="score-button-18"   onclick="button_click(this, event)">18</button>
				<button type="button" class="score-button" id="score-button-19"   onclick="button_click(this, event)">19</button>
				<button type="button" class="score-button" id="score-button-20"   onclick="button_click(this, event)">20</button>
				<button type="button" class="score-button" id="score-button-x2"   onclick="button_click(this, event)">x2</button>
				<button type="button" class="score-button" id="score-button-x3"   onclick="button_click(this, event)">x3</button>
				<button type="button" class="score-button" id="score-button-bull" onclick="button_click(this, event)">SB</button>
				<button type="button" class="score-button" id="score-button-out"  onclick="button_click(this, event)">Out</button>
				<button type="button" class="score-button" id="score-button-undo" onclick="button_click(this, event)">Undo</button>
			</div>
		</div>
	</body>
</html>
